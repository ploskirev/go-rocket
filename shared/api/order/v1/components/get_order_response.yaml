type: object
required:
  - transaction_uuid
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - payment_method
  - status
properties:
  transaction_uuid:
    type: string
    description: UUID транзакции
    example: "c6hf87Yh75KHJo0836b"
  order_uuid:
    type: string
    description: UUID заказа
    example: "c6hf87Yh75KHJo0836b"
  user_uuid:
    type: string
    description: UUID пользователя
    example: "c6hf87Yh75KHJo0836b"
  part_uuids:
    type: array
    items:
      type: string
      description: UUID детали
      example: nj8hf53mp9y
  total_price:
    type: number
    format: float
    description: стоимость заказа
    example: 123.45
  payment_method:
    $ref: ./enums/payment_method.yaml
  status:
    $ref: ./enums/order_status.yaml
